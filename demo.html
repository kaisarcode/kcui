<!DOCTYPE html>
<html lang="en">
    <head>
        <title>KCUI Demo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="KCUI">
        <link rel="stylesheet" href="kcui.css">
    </head>
    <body>
        <div class="app">
            <header class="hdr">
                <div class="wrp">
                    <h1>
                        <a href="/">
                            <i class="ico">❁</i>
                            <span>KCUI</span>
                        </a>
                    </h1>
                    <nav>
                        <a href=""><i class="ico">⚀</i><span>Item</span></a>
                        <a href=""><i class="ico">⚁</i><span>Item</span></a>
                        <a href=""><i class="ico">⚂</i><span>Item</span></a>
                    </nav>
                </div>
            </header>

            <main class="bdy">
                <div class="wrp row">

                    <article class="pnl">
                        <header class="hdr">
                            <h2>Article</h2>
                        </header>
                        <section class="bdy">
                            <p>Main content.</p>
                            <p>
                                This content can grow vertically. The scroll remains
                                inside the main region while the page header and
                                footer remain visible.
                            </p>
                        </section>
                    </article>

                    <aside class="pnl">
                        <header class="hdr">
                            <h2>Aside</h2>
                        </header>

                        <section class="bdy">
                            Aside content.
                        </section>
                    </aside>

                </div>
            </main>

            <footer class="ftr">
                <div class="wrp">
                    <p>&copy; 2025 KaisarCode</p>
                    <nav>
                        <a href=""><i class="ico">⚀</i><span>Item</span></a>
                        <a href=""><i class="ico">⚁</i><span>Item</span></a>
                        <a href=""><i class="ico">⚂</i><span>Item</span></a>
                    </nav>
                </div>
            </footer>
        </div>

        <dialog class="dlg">
            Modal content.
        </dialog>
    </body>
</html>
