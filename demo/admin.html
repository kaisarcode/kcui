<!DOCTYPE html>
<html lang="en">
    <head>
        <title>KCUI Admin</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="KCUI admin layout example">
        <link rel="stylesheet" href="../kcui.css">
    </head>
    <body>
        <div class="grl">
            <header class="hdr">
                <h1>
                    <a href="/">
                        <i class="ico">❁</i>
                        <span>KCUI</span>
                    </a>
                </h1>
                <nav>
                    <a href="#">Account</a>
                    <a href="#">Logout</a>
                </nav>
            </header>

            <main class="bdy">
                <div class="row">

                    <aside class="pnl col2">
                        <header class="hdr">
                            <h2>Navigation</h2>
                        </header>

                        <nav class="bdy">
                            <p><a href="#">Dashboard</a></p>
                            <p><a href="#">Content</a></p>
                            <p><a href="#">Users</a></p>
                            <p><a href="#">Settings</a></p>
                        </nav>
                    </aside>

                    <section class="pnl">
                        <header class="hdr">
                            <h2>Dashboard</h2>
                        </header>

                        <section class="bdy">

                            <div class="row mar">

                                <article class="pnl">
                                    <header class="hdr">
                                        <h3>Panel 1</h3>
                                    </header>
                                    <section class="bdy">
                                        Content.
                                    </section>
                                </article>

                                <article class="pnl">
                                    <header class="hdr">
                                        <h3>Panel 2</h3>
                                    </header>
                                    <section class="bdy">
                                        Content.
                                    </section>
                                </article>

                                <article class="pnl">
                                    <header class="hdr">
                                        <h3>Panel 3</h3>
                                    </header>
                                    <section class="bdy">
                                        Content.
                                    </section>
                                </article>

                            </div>

                            <article class="pnl">
                                <header class="hdr">
                                    <h3>
                                        <i class="ico">❁</i>
                                        <span>Panel</span>
                                    </h3>
                                    <nav>
                                        <a href="#">Item</a>
                                    </nav>
                                </header>
                                <section class="bdy">
                                    This is a panel content.
                                </section>
                            </article>

                        </section>
                    </section>
                </div>
            </main>

            <footer class="ftr">
                <p>&copy; 2026 KaisarCode</p>
                <nav>
                    <a href="#">Item</a>
                </nav>
            </footer>
        </div>
    </body>
</html>
